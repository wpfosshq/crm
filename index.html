<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buzz CRM 🐝</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --accent: #f5b301;
    --accent-2: #ffcf40;
    --green: #2ecc71;
    --blue: #3aa0ff;
    --red: #ff5c6c;
    --purple: #b085f5;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #14171e, #0f1115);
    position: sticky; top: 0; z-index: 30;
    flex-wrap: wrap;
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
  .logo span { color: var(--accent); }
  .spacer { flex: 1; }
  input, select, textarea, button { font-family: inherit; font-size: 14px; }
  .search {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 10px; min-width: 220px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600;
    transition: .15s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #1a1300; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.ghost { background: transparent; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }

  .stats { display: flex; gap: 12px; padding: 18px 22px 6px; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; min-width: 150px; flex: 1;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .stat .value { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .stat .value.green { color: var(--green); }
  .stat .value.gold { color: var(--accent); }

  .toolbar { display: flex; gap: 10px; padding: 10px 22px 18px; align-items: center; flex-wrap: wrap; }
  .toolbar .tabs { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .tab { padding: 7px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tab.active { background: var(--panel-2); color: var(--text); }

  /* Board */
  .board { display: flex; gap: 14px; padding: 0 22px 40px; overflow-x: auto; align-items: flex-start; }
  .col {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    min-width: 280px; width: 280px; flex-shrink: 0; display: flex; flex-direction: column;
  }
  .col-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .col-title { font-weight: 700; }
  .col-count { color: var(--muted); font-size: 12px; background: var(--panel-2); padding: 1px 8px; border-radius: 20px; }
  .col-sum { margin-left: auto; color: var(--muted); font-size: 12px; }
  .col-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 60px; }
  .col-body.drag-over { background: rgba(245,179,1,.06); }
  .card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; cursor: grab; transition: .12s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.dragging { opacity: .5; }
  .card .deal { font-weight: 700; margin-bottom: 4px; }
  .card .company { color: var(--muted); font-size: 12px; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .card .amt { font-weight: 800; color: var(--accent); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }

  /* Table */
  table { width: calc(100% - 44px); margin: 0 22px 40px; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; user-select: none; }
  tbody tr:hover, tr:hover { background: var(--panel-2); }
  tbody tr { cursor: pointer; }
  td .amt { font-weight: 700; color: var(--accent); }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 20px; display: inline-block; font-weight: 600; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
  .modal-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .modal-head h2 { margin: 0; font-size: 18px; }
  .modal-body { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .field input, .field select, .field textarea {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 10px 12px; border-radius: 10px; outline: none; width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 70px; }
  .modal-foot { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; }
  .empty { color: var(--muted); text-align: center; padding: 50px 20px; }
  .close-x { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; margin-left: auto; }
  .hidden { display: none !important; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 22px 18px; }
</style>
</head>
<body>
<header>
  <div class="logo">Buzz <span>CRM</span> 🐝</div>
  <div class="spacer"></div>
  <input id="search" class="search" placeholder="Search deals, companies, contacts…" />
  <button class="btn" id="importBtn">Import CSV</button>
  <button class="btn" id="exportBtn">Export CSV</button>
  <button class="btn primary" id="addBtn">+ Add Lead</button>
  <input type="file" id="importFile" accept=".csv" class="hidden" />
</header>

<div class="stats" id="stats"></div>

<div class="toolbar">
  <div class="tabs">
    <div class="tab active" data-view="board">Pipeline</div>
    <div class="tab" data-view="table">Table</div>
  </div>
  <div class="spacer"></div>
  <select id="currency" class="search" style="min-width:auto">
    <option value="KSh">KSh (KES)</option>
    <option value="$">$ (USD)</option>
    <option value="€">€ (EUR)</option>
    <option value="£">£ (GBP)</option>
    <option value="₹">₹ (INR)</option>
    <option value="">No symbol</option>
  </select>
</div>

<div id="boardView"><div class="board" id="board"></div></div>
<div id="tableView" class="hidden"></div>
<div class="hint">Tip: drag cards between stages to update a deal. Everything saves automatically in this browser.</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Add Lead</h2>
      <button class="close-x" id="closeBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field full">
        <label>Deal name *</label>
        <input id="f_deal" placeholder="e.g. Acme – Google Workspace" />
      </div>
      <div class="field">
        <label>Company</label>
        <input id="f_company" placeholder="Company name" />
      </div>
      <div class="field">
        <label>Contact name</label>
        <input id="f_contact" placeholder="Who you talk to" />
      </div>
      <div class="field">
        <label>Service</label>
        <input id="f_service" placeholder="e.g. Website Development" />
      </div>
      <div class="field">
        <label>Amount</label>
        <input id="f_amount" type="number" step="0.01" placeholder="0" />
      </div>
      <div class="field">
        <label>Stage</label>
        <select id="f_stage"></select>
      </div>
      <div class="field">
        <label>Created by</label>
        <input id="f_by" placeholder="You / your team" />
      </div>
      <div class="field full">
        <label>Description / notes</label>
        <textarea id="f_desc" placeholder="Context, next steps, what they want…"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn danger ghost" id="deleteBtn">Delete</button>
      <div style="display:flex;gap:10px">
        <button class="btn ghost" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
const STAGES = [
  { key: "New Lead",                    color: "#3aa0ff" },
  { key: "Contacted",                   color: "#b085f5" },
  { key: "Proposal/Price Quote Sent",   color: "#f5b301" },
  { key: "Negotiation",                 color: "#ff9f43" },
  { key: "Closed Won",                  color: "#2ecc71" },
  { key: "Closed Lost",                 color: "#ff5c6c" },
];
const stageColor = k => (STAGES.find(s => s.key === k) || {}).color || "#9aa3b2";
const KEY = "buzz_crm_deals_v1";
const CUR_KEY = "buzz_crm_currency";

const SEED = [
  { deal:"Jael Musimbi – Google Workspace", company:"Bloom Balance", service:"Google Workspace", contact:"Jael Musimbi", stage:"Closed Won", amount:1267, by:"WPfoss", desc:"Jael wanted Google Workspace starter flexible price. She has already paid and setup is in session." },
  { deal:"Kencharge Google Workspace", company:"Kencharge", service:"Google Workspace", contact:"Shelmith Ireri", stage:"Proposal/Price Quote Sent", amount:25334, by:"WPfoss", desc:"They wanted Google Workspace commit plan for 2 accounts. A proposal and invoice was sent." },
  { deal:"Skyward Airlines Cloudflare Management", company:"Skyward Airlines", service:"Website Management", contact:"Lewis (Skyward Airlines)", stage:"Proposal/Price Quote Sent", amount:20000, by:"WPfoss", desc:"Skyward Airlines wants us to manage and migrate their website to Cloudflare. They will pay 20k first month and then 15k every month." },
  { deal:"Feisal Google Workspace", company:"Profyl", service:"Google Workspace", contact:"Feisal Haji", stage:"Closed Won", amount:3798, by:"WPfoss", desc:"Purchased Google Workspace from us." },
  { deal:"Tinia Website Development", company:"Tinia", service:"Website Development", contact:"Silas", stage:"Proposal/Price Quote Sent", amount:60000, by:"WPfoss", desc:"Website development service." },
  { deal:"Rancesecurity Web Design", company:"Rancesecurity", service:"Web Design", contact:"Collins", stage:"Proposal/Price Quote Sent", amount:40000, by:"", desc:"Website development service." },
  { deal:"Takaful Insurance – Google Workspace", company:"Takaful Insurance of Africa (TIA)", service:"Google Workspace", contact:"Procurement", stage:"Closed Lost", amount:1929646, by:"WPfoss", desc:"Google Workspace." },
];

let deals = load();
let currency = localStorage.getItem(CUR_KEY) || "KSh";
let view = "board";
let editingId = null;
let search = "";
let sortKey = null, sortDir = 1;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const seeded = SEED.map((d, i) => ({ id: uid(), createdAt: Date.now() + i, ...d }));
  localStorage.setItem(KEY, JSON.stringify(seeded));
  return seeded;
}
function save() { localStorage.setItem(KEY, JSON.stringify(deals)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function money(n) {
  const v = Number(n) || 0;
  return (currency ? currency + " " : "") + v.toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])); }

function filtered() {
  const q = search.trim().toLowerCase();
  let list = deals.slice();
  if (q) list = list.filter(d =>
    [d.deal, d.company, d.contact, d.service, d.desc, d.stage].some(f => (f || "").toLowerCase().includes(q))
  );
  return list;
}

/* ---------- Stats ---------- */
function renderStats() {
  const list = filtered();
  const open = list.filter(d => !d.stage.startsWith("Closed"));
  const won = list.filter(d => d.stage === "Closed Won");
  const openVal = open.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  const wonVal = won.reduce((s, d) => s + (Number(d.amount) || 0), 0);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="label">Total deals</div><div class="value">${list.length}</div></div>
    <div class="stat"><div class="label">Open pipeline</div><div class="value gold">${money(openVal)}</div></div>
    <div class="stat"><div class="label">Won revenue</div><div class="value green">${money(wonVal)}</div></div>
    <div class="stat"><div class="label">Open deals</div><div class="value">${open.length}</div></div>
  `;
}

/* ---------- Board ---------- */
function renderBoard() {
  const list = filtered();
  const board = document.getElementById("board");
  board.innerHTML = "";
  STAGES.forEach(st => {
    const items = list.filter(d => d.stage === st.key);
    const sum = items.reduce((s, d) => s + (Number(d.amount) || 0), 0);
    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `
      <div class="col-head">
        <span class="dot" style="background:${st.color}"></span>
        <span class="col-title">${st.key}</span>
        <span class="col-count">${items.length}</span>
        <span class="col-sum">${sum ? money(sum) : ""}</span>
      </div>
      <div class="col-body" data-stage="${esc(st.key)}"></div>`;
    const body = col.querySelector(".col-body");
    items.forEach(d => body.appendChild(cardEl(d)));
    body.addEventListener("dragover", e => { e.preventDefault(); body.classList.add("drag-over"); });
    body.addEventListener("dragleave", () => body.classList.remove("drag-over"));
    body.addEventListener("drop", e => {
      e.preventDefault(); body.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain");
      const d = deals.find(x => x.id === id);
      if (d && d.stage !== st.key) { d.stage = st.key; save(); render(); }
    });
    board.appendChild(col);
  });
}
function cardEl(d) {
  const el = document.createElement("div");
  el.className = "card";
  el.draggable = true;
  el.innerHTML = `
    <div class="deal">${esc(d.deal)}</div>
    <div class="company">${esc(d.company || "—")}${d.contact ? " · " + esc(d.contact) : ""}</div>
    <div class="meta">
      <span class="amt">${money(d.amount)}</span>
      ${d.service ? `<span class="badge">${esc(d.service)}</span>` : ""}
    </div>`;
  el.addEventListener("click", () => openModal(d.id));
  el.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", d.id); el.classList.add("dragging"); });
  el.addEventListener("dragend", () => el.classList.remove("dragging"));
  return el;
}

/* ---------- Table ---------- */
function renderTable() {
  let list = filtered();
  if (sortKey) {
    list.sort((a, b) => {
      let x = a[sortKey], y = b[sortKey];
      if (sortKey === "amount") { x = Number(x) || 0; y = Number(y) || 0; }
      else { x = (x || "").toString().toLowerCase(); y = (y || "").toString().toLowerCase(); }
      return x < y ? -sortDir : x > y ? sortDir : 0;
    });
  }
  const cols = [["deal","Deal"],["company","Company"],["contact","Contact"],["service","Service"],["stage","Stage"],["amount","Amount"]];
  const wrap = document.getElementById("tableView");
  if (!list.length) { wrap.innerHTML = `<div class="empty">No deals yet. Hit “+ Add Lead” to start. 🐝</div>`; return; }
  wrap.innerHTML = `<table><thead><tr>${cols.map(c =>
    `<th data-k="${c[0]}">${c[1]}${sortKey===c[0]?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead>
    <tbody>${list.map(d => `
      <tr data-id="${d.id}">
        <td><strong>${esc(d.deal)}</strong></td>
        <td>${esc(d.company||"—")}</td>
        <td>${esc(d.contact||"—")}</td>
        <td>${esc(d.service||"—")}</td>
        <td><span class="pill" style="background:${stageColor(d.stage)}22;color:${stageColor(d.stage)}">${esc(d.stage)}</span></td>
        <td><span class="amt">${money(d.amount)}</span></td>
      </tr>`).join("")}</tbody></table>`;
  wrap.querySelectorAll("th").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
    renderTable();
  }));
  wrap.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => openModal(tr.dataset.id)));
}

/* ---------- Render ---------- */
function render() {
  renderStats();
  document.getElementById("boardView").classList.toggle("hidden", view !== "board");
  document.getElementById("tableView").classList.toggle("hidden", view !== "table");
  if (view === "board") renderBoard(); else renderTable();
}

/* ---------- Modal ---------- */
function fillStageSelect() {
  document.getElementById("f_stage").innerHTML = STAGES.map(s => `<option value="${esc(s.key)}">${esc(s.key)}</option>`).join("");
}
function openModal(id) {
  editingId = id || null;
  const d = id ? deals.find(x => x.id === id) : {};
  document.getElementById("modalTitle").textContent = id ? "Edit Deal" : "Add Lead";
  document.getElementById("f_deal").value = d.deal || "";
  document.getElementById("f_company").value = d.company || "";
  document.getElementById("f_contact").value = d.contact || "";
  document.getElementById("f_service").value = d.service || "";
  document.getElementById("f_amount").value = d.amount != null ? d.amount : "";
  document.getElementById("f_stage").value = d.stage || "New Lead";
  document.getElementById("f_by").value = d.by || "";
  document.getElementById("f_desc").value = d.desc || "";
  document.getElementById("deleteBtn").style.visibility = id ? "visible" : "hidden";
  document.getElementById("overlay").classList.add("open");
  document.getElementById("f_deal").focus();
}
function closeModal() { document.getElementById("overlay").classList.remove("open"); editingId = null; }
function saveModal() {
  const deal = document.getElementById("f_deal").value.trim();
  if (!deal) { document.getElementById("f_deal").focus(); return; }
  const rec = {
    deal,
    company: document.getElementById("f_company").value.trim(),
    contact: document.getElementById("f_contact").value.trim(),
    service: document.getElementById("f_service").value.trim(),
    amount: parseFloat(document.getElementById("f_amount").value) || 0,
    stage: document.getElementById("f_stage").value,
    by: document.getElementById("f_by").value.trim(),
    desc: document.getElementById("f_desc").value.trim(),
  };
  if (editingId) { Object.assign(deals.find(x => x.id === editingId), rec); }
  else { deals.unshift({ id: uid(), createdAt: Date.now(), ...rec }); }
  save(); closeModal(); render();
}
function deleteDeal() {
  if (!editingId) return;
  if (!confirm("Delete this deal?")) return;
  deals = deals.filter(x => x.id !== editingId);
  save(); closeModal(); render();
}

/* ---------- CSV ---------- */
function exportCSV() {
  const cols = ["deal","company","contact","service","stage","amount","by","desc"];
  const head = ["Deal Name","Company","Contact","Service","Stage","Amount","Created By","Description"];
  const rows = deals.map(d => cols.map(c => csvCell(d[c])).join(","));
  const blob = new Blob([head.join(",") + "\n" + rows.join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "buzz-crm-export.csv";
  a.click();
}
function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c === "\r") {}
      else cell += c;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function importCSV(text) {
  const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ""));
  if (!rows.length) return;
  // find header row (one containing "Deal")
  let hi = rows.findIndex(r => r.some(c => /deal name|deal/i.test(c)));
  if (hi < 0) hi = 0;
  const head = rows[hi].map(h => h.trim().toLowerCase());
  const idx = names => head.findIndex(h => names.some(n => h.includes(n)));
  const iDeal = idx(["deal name","deal"]), iCo = idx(["company"]), iContact = idx(["contact"]),
        iServ = idx(["service"]), iStage = idx(["stage"]), iAmt = idx(["amount"]),
        iDesc = idx(["description","notes"]), iBy = idx(["created by","by"]);
  let added = 0;
  for (let r = hi + 1; r < rows.length; r++) {
    const row = rows[r];
    const get = i => (i >= 0 && row[i] != null ? row[i].trim() : "");
    const deal = get(iDeal);
    if (!deal) continue;
    const amt = parseFloat(get(iAmt).replace(/[^0-9.\-]/g, "")) || 0;
    deals.unshift({ id: uid(), createdAt: Date.now(), deal, company: get(iCo), contact: get(iContact),
      service: get(iServ), stage: matchStage(get(iStage)), amount: amt, by: get(iBy), desc: get(iDesc) });
    added++;
  }
  save(); render();
  alert(added + " deal(s) imported. 🐝");
}
function matchStage(s) {
  if (!s) return "New Lead";
  const found = STAGES.find(st => st.key.toLowerCase() === s.toLowerCase());
  if (found) return found.key;
  const l = s.toLowerCase();
  if (l.includes("won")) return "Closed Won";
  if (l.includes("lost")) return "Closed Lost";
  if (l.includes("propos") || l.includes("quote")) return "Proposal/Price Quote Sent";
  if (l.includes("negoti")) return "Negotiation";
  if (l.includes("contact")) return "Contacted";
  return "New Lead";
}

/* ---------- Wire up ---------- */
fillStageSelect();
document.getElementById("currency").value = currency;
document.getElementById("addBtn").onclick = () => openModal(null);
document.getElementById("closeBtn").onclick = closeModal;
document.getElementById("cancelBtn").onclick = closeModal;
document.getElementById("saveBtn").onclick = saveModal;
document.getElementById("deleteBtn").onclick = deleteDeal;
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.getElementById("search").addEventListener("input", e => { search = e.target.value; render(); });
document.getElementById("currency").addEventListener("change", e => { currency = e.target.value; localStorage.setItem(CUR_KEY, currency); render(); });
document.getElementById("exportBtn").onclick = exportCSV;
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const reader = new FileReader();
  reader.onload = () => importCSV(reader.result);
  reader.readAsText(f);
  e.target.value = "";
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active"); view = t.dataset.view; render();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

render();
</script>
</body>
</html>
